<style>
:root{
  --bg:#000;--bg2:#070d2b;--s1:#101116;--s2:#17181f;--s3:#1f212a;--ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.12);
  --tx:#eceef4;--mut:#9096a4;--dim:#666c7a;--acc:#4f7cff;--acc2:#8b5cf6;--err:#ff7b7b;
  --grad:linear-gradient(135deg,#3b82f6 0%,#6366f1 55%,#8b5cf6 100%);
  --r:22px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--tx);font-family:'IBM Plex Sans Arabic','Noto Sans Arabic','Segoe UI',Cairo,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(180deg,#000 0%,#000 50%,var(--bg2) 100%) fixed;overscroll-behavior:none}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:transparent;padding:0}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#2b2e38;border-radius:9px}
#app{height:100dvh;display:flex;flex-direction:column;max-width:860px;margin:0 auto;position:relative}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) 12px 6px;position:relative;z-index:5;background:linear-gradient(#000 40%,transparent)}
.ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx);transition:background .15s}
.ib:hover,.ib:active{background:rgba(255,255,255,.08)}

.md{line-height:1.85;word-break:break-word;font-size:16px}

.acts{display:flex;gap:2px;margin-top:6px}

/* drawer + lightbox */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}

.sheet{position:fixed;left:0;right:0;bottom:0;max-width:860px;margin:0 auto;background:#0d0e13;border:1px solid var(--ln);border-bottom:0;border-radius:26px 26px 0 0;z-index:52;padding:14px 14px calc(var(--sab) + 14px);transform:translateY(105%);transition:transform .25s cubic-bezier(.3,.8,.3,1);max-height:82dvh;overflow:auto}

.opt:hover,.opt.sel{background:var(--s2)}
.opt svg{color:var(--acc)}

.row2{display:flex;gap:8px;margin-top:10px}
.btn2{flex:1;padding:13px;border-radius:999px;background:var(--s3);font-weight:500}

.pa{display:flex;gap:8px;flex-wrap:wrap}.pa button{display:flex;align-items:center;gap:6px;background:var(--s3);border-radius:999px;padding:9px 14px;font-size:14px}

.sfxg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sfxi{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:8px 10px;gap:4px}

function highlight(code){

function md(src){
  let s=String(src);if((s.match(/```/g)||[]).length%2)s+='\n```';
  const blocks=[];
  s=s.replace(/```([\w+#.-]*)[^\n]*\n([\s\S]*?)```/g,(m,l,c)=>{blocks.push(codeBlock(l,c.replace(/\n$/,'')));return '\n@@B'+(blocks.length-1)+'@@\n'});
  const L=s.split('\n'),out=[];let i=0;

  const isStart=l=>/^@@B\d+@@$/.test(l)||/^#{1,4}\s/.test(l)||isList(l)||/^\s*>/.test(l)||/^\s*\|.*\|\s*$/.test(l)||/^\s*([-*_])\1{2,}\s*$/.test(l);
  while(i<L.length){
    const l=L[i];let m;
    if((m=l.match(/^@@B(\d+)@@$/))){out.push(blocks[+m[1]]);i++;continue}
    if(/^\s*$/.test(l)){i++;continue}
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){const n=Math.min(m[1].length+1,5);out.push('<h'+n+'>'+inline(esc(m[2]))+'</h'+n+'>');i++;continue}

    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(esc(c.trim())));

/* ---- intent detection (instant, rule-based) ---- */
const IMG_N=/(صور[ةه]|رسم[ةه]?|لوغو|شعار|بوستر|ملصق|خلفي[ةه]|[اأإ]يقون[ةه]|image|picture|photo|logo|poster|wallpaper|illustration|artwork|icon)/i;

const GEN_V=/(ارسم|صمم|صمّم|سوي|سوّي|سويلي|سوّيلي|اعمل|اعملي|ولد|ولّد|توليد|انشئ|أنشئ|اصنع|جيب|جيبلي|انطيني|دزلي|عطيني|draw|generate|create|make|design|render|paint|produce|give me)/i;
const HOW=/(شلون|كيف|ليش|لماذا|شنو الفرق|how (to|do|can|does)|why|what is|explain|اشرح|طريقة)/i;
const QUES=/(شنو|ماذا|ما هذ|وصف|describe|what|اقرأ|اقرا|read|ترجم|translate|حلل|analy|اشرح|explain|وين|مين|who|where|عدد|count|كم )/i;
const EDIT=/(عدل|عدّل|غير|غيّر|بدل|بدّل|شيل|احذف|امسح|ضيف|أضف|اضف|خلي|خلّي|حول|حوّل|لون|edit|change|remove|add|replace|make it|make this|turn|convert|style|blur|enhance|upscale|حسن|حسّن)/i;
const CODE=/(```|function\s|=>|\bclass\s|\bdef\s|import\s|SELECT\s|<div|برمج|كود|code|bug|debug|html|css|javascript|typescript|python|java\b|kotlin|swift|react|vue|angular|node\.?js|flutter|django|flask|laravel|sql|regex|سكربت|script|compile|يبني (لي )?(تطبيق|موقع|برنامج)|اصلح (الكود|البق)|refactor|unit test|api\b)/i
function detectIntent(text,hasImg,prevWasMedia){
  const t=(text||'').trim().slice(0,300);
  if(hasImg){
    if(!t||QUES.test(t))return 'vision';
    return (EDIT.test(t)||GEN_V.test(t))?'image':'vision';
  }
  if(AUD_N.test(t)&&!HOW.test(t))return 'audio';
  if(VID_N.test(t)&&GEN_V.test(t)&&!HOW.test(t))return 'video';
  if(!HOW.test(t)&&((IMG_N.test(t)&&GEN_V.test(t))||/^(صور[ةه]|رسم[ةه]?|image of|picture of|a picture of|photo of)\s/i.test(t)))return 'image';
  if(prevWasMedia&&t.length<120&&EDIT.test(t)&&!QUES.test(t)&&!CODE.test(t))return 'image';
  if(CODE.test(t))return 'code';
  if(/ترجم|translate/i.test(t))return 'translate';
  return 'chat';
}

const BAD=/guard|safety|embed|rerank|moderation|tts|whisper|audio|lyria|image|^openrouter\//i;
const SMALL=/(^|[-_/])(mini|nano|lite|tiny|1b|2b|3b|4b|7b|8b|9b|12b)([-_:]|$)/i;

function score(m,task,ar){
  const id=m.id.toLowerCase(),name=id.split('/').pop();let s=0;
  const pm=name.match(/(\d+(?:\.\d+)?)b(?![a-z])/);s+=Math.min(pm?+pm[1]:0,360)/6;
  s+=Math.min((m.ctx||0)/20000,8);
  s+=Math.max(0,Math.min(12,((m.created||0)-1.70e9)/1.0e7));
  for(const[re,pts]of FAMILY)if(re.test(id)){s+=pts;break}
  if(SMALL.test(name))s-=18;
  if(REASON.test(name))s-=12;
  if(task==='code'){
    if(/coder|devstral|codestral|starcoder|codegemma|codellama|wizardcoder|magicoder|opencoder/.test(id))s+=24;
    else if(/deepseek|qwen|gpt-5|gpt-oss|glm|laguna|inkling|kimi-k2|mistral-(large|medium)/.test(id))s+=16;
  }
  if(ar&&/gemini|qwen|llama-(3\.3|4)|deepseek|gpt|gemma|mistral|glm|kimi|nemotron|inkling/.test(id))s+=10;
  if(store.get('win:'+task,'')===m.id)s+=25;
  return s;

const memMedia=new Map();let dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise((ok,no)=>{try{const r=indexedDB.open('jeron',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});return dbp}
async function mPut(k,v){memMedia.set(k,v);try{const d=await idb();await new Promise((ok,no)=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}catch(e){}}
async function mGet(k){if(memMedia.has(k))return memMedia.get(k);try{const d=await idb();return await new Promise((ok,no)=>{const r=d.transaction('m').objectStore('m').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}catch(e){return null}}
async function mDel(k){memMedia.delete(k);try{const d=await idb();d.transaction('m','readwrite').objectStore('m').delete(k)}catch(e){}}
const urlCache=new Map();
async function mURL(k){if(urlCache.has(k))return urlCache.get(k);const v=await mGet(k);if(!v)return '';const u=typeof v==='string'?v:URL.createObjectURL(v);urlCache.set(k,u);return u}
function fileToDataURL(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const M=1568;let{width:w,height:h}=im;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.88))};im.onerror=()=>no(new Error('x'));im.src=u})}

class Fatal extends Error{}
async function apiFail(res){let m='';try{m=(await res.clone().json()).error?.message||''}catch(e){}const e=new Error(m||('HTTP '+res.status));e.status=res.status;if(res.status===402||NOCREDIT.test(m)){e.credit=true;flagNoCredit()}return e}
function linkAbort(user,ac){const f=()=>ac.abort();user?.addEventListener('abort',f);return()=>user?.removeEventListener('abort',f)}

const hdrFor=c=>c.or?hdr():{'Authorization':'Bearer '+c.key,'Content-Type':'application/json'};
const MAX_OUT=8000;                 // أعلى عدد توكِن بالرد الواحد (يمنع القطع المبكر)
const MAX_OUT_CODE=16000;           // حد أعلى خاص بمهام البرمجة (ملفات/مشاريع أطول)
async function streamRaw(c,messages,onDelta,user,already,maxOut){
  maxOut=maxOut||MAX_OUT;
  const ac=new AbortController();let timed=false,got=false,gotC=false,acc='',finish='';
  const un=linkAbort(user,ac);
  const t1=setTimeout(()=>{if(!got){timed=true;ac.abort()}},c.slow?60000:(c.free?22000:28000));
  let t2=null;
  try{
    const res=await fetch(c.base+'/chat/completions',{method:'POST',headers:hdrFor(c),signal:ac.signal,body:JSON.stringify(Object.assign({model:c.id,messages,stream:true,max_tokens:Math.min(maxOut,c.cap||maxOut)},c.body||{}))});
    if(!res.ok)throw await apiFail(res);
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const{done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(d==='[DONE]')continue;
        let j;try{j=JSON.parse(d)}catch(e){continue}
        if(j.error){if(acc)break;throw new Error(j.error.message||'err')}
        const ch=j.choices?.[0]||{},dl=ch.delta||{};
        if(ch.finish_reason)finish=ch.finish_reason;
        if((dl.reasoning||dl.reasoning_content)&&!got){got=true;t2=setTimeout(()=>{if(!gotC){timed=true;ac.abort()}},45000)}
        if(dl.content){got=true;gotC=true;if(t2)clearTimeout(t2);acc+=dl.content;onDelta(already+acc)}
      }
    }
    if(!acc.trim()&&!already)throw new Error('empty');
    return{text:acc,finish};
  }catch(e){
    if(user?.aborted){const u=new Error('user');u.user=true;throw u}
    if(acc)return{text:acc,finish:'abort'};
    if(timed)throw new Error('timeout');
    throw e;
  }finally{clearTimeout(t1);if(t2)clearTimeout(t2);un()}
}
async function streamOnce(c,messages,onDelta,user,task){
  // إذا النموذج قطع الرد بسبب حد التوكِن (finish_reason==='length')، يكمل تلقائيًا من نفس النقطة
  // بدل ما يوقف بنص الكود. يحاول لين 4 مرات كحد أقصى لنفس الرد.
  const maxOut=task==='code'?MAX_OUT_CODE:MAX_OUT;
  let full='',msgs=messages;
  for(let round=0;round<4;round++){
    const r=await streamRaw(c,msgs,onDelta,user,full,maxOut);
    full+=r.text;
    if(r.finish!=='length'||!r.text.trim())return full;
    msgs=messages.concat([{role:'assistant',content:full},{role:'user',content:'Continue exactly where you left off. Do not repeat anything, do not add any comment — output only the rest of the content/code.'}]);
  }
  return full;
}
async function runText(task,messages,onDelta,user,opt={}){
  const cands=rankText(task,!!opt.vision,!!opt.ar);let lastErr=null,n=0;
  for(const c of cands){
    if(creditOut()&&!c.free&&!c.extra)continue;
    if(n++>=12)break;
    try{
      const out=await streamOnce(c,messages,onDelta,user,task);
      store.set('win:'+task,c.id);return out;
    }catch(e){
      if(e.user)throw e;
      if(e.status===401&&c.or){const f=new Fatal('مفتاح الخدمة غير صالح حاليًا.');f.fatal=true;throw f}
      dbg('text',c.id,e.status||'',String(e.message).slice(0,90));markFail(ckey(c),e.status);lastErr=e;
    }
  }
  throw lastErr||new Error('no models');
}
async function completeOnce(c,messages,user,ms=30000){
  const ac=new AbortController(),un=linkAbort(user,ac),t=setTimeout(()=>ac.abort(),ms);
  try{
    const res=await fetch(c.base+'/chat/completions',{method:'POST',headers:hdrFor(c),signal:ac.signal,body:JSON.stringify(Object.assign({model:c.id,messages,max_tokens:Math.min(MAX_OUT,c.cap||MAX_OUT)},c.body||{}))});
    if(!res.ok)throw await apiFail(res);
    const j=await res.json();if(j.error)throw new Error(j.error.message);
    const x=j.choices?.[0]?.message?.content;if(!x||!String(x).trim())throw new Error('empty');return String(x).trim();
  }finally{clearTimeout(t);un()}
}
async function textSilent(task,messages,user){
  for(const c of rankText(task,false,false).slice(0,4)){try{return await completeOnce(c,messages,user,25000)}catch(e){if(user?.aborted)throw e;markFail(ckey(c),e.status)}}
  return '';
}
async function enhancePrompt(kind,text,user){
  if(!text)return text;
  const sys=kind==='video'
   ?'Rewrite the user request as ONE vivid, detailed English prompt for a text-to-video model: subject, action, setting, camera movement, lighting, style. Output only the prompt.'
   :'Rewrite the user request as ONE vivid, detailed English prompt for an image generation model: subject, composition, style, lighting, colors, detail. Keep any text that must appear in the image exactly. Output only the prompt.';
  try{const r=await textSilent('chat',[{role:'system',content:sys},{role:'user',content:text}],user);return r||text}catch(e){if(user?.aborted)throw e;return text}
}

async function send(textOverride){

  const text=(textOverride!=null?textOverride:$('#in').value).trim(),imgs=pend.slice();

  c.ts=Date.now();

async function respond(c){
  const lastU=[...c.msgs].reverse().find(m=>m.role==='user');if(!lastU)return;
  const prev=c.msgs[c.msgs.length-2];
  const prevMedia=!!(prev&&prev.role==='assistant'&&prev.media&&prev.media.some(x=>x.type==='image'));
  const intent=detectIntent(lastU.content,lastU.imgs.length>0,prevMedia);
  const a={id:uid(),role:'assistant',content:'',media:[],pending:true,gen:(intent==='image'||intent==='video'||intent==='audio')?intent:null,ts:Date.now()};
  c.msgs.push(a);setBusy(true);renderAll();ctrl=new AbortController();
  try{
    if(intent==='image')await doImage(c,lastU,a,prevMedia);
    else if(intent==='video')await doVideo(lastU,a);
    else if(intent==='audio')await doAudio(lastU,a);
    else await doText(c,lastU,a,intent);
  }catch(e){
    if(e.user){if(!a.content&&!a.media.length)c.msgs.splice(c.msgs.indexOf(a),1)}
    else{dbg('respond error',e.message,e.status||'');a.err=e.userMsg||(e.fatal?e.message:(e.credit?'حد مفتاح الخدمة وصل نهايته. ارفع الحد أو اشحن الرصيد من حساب OpenRouter.':'ما كدرت أكمل هسه. جرب مرة ثانية.'))}
  }
  a.pending=false;a.gen=null;
  if(c.msgs.includes(a)&&!a.content&&!a.media.length&&!a.err)a.err='ما كدرت أكمل هسه. جرب مرة ثانية.';
  setBusy(false);save();renderAll();
}
async function doText(c,lastU,a,intent){
  const hist=c.msgs.filter(m=>m!==a).slice(-24);
  const api=[{role:'system',content:buildSystem()}];let vision=false;
  for(let i=0;i<hist.length;i++){
    const m=hist[i];
    if(m.role==='user'&&m.imgs&&m.imgs.length&&hist.length-i<=4){
      const parts=[{type:'text',text:m.content||'ما هذا؟'}];
      for(const id of m.imgs){const d=await mGet(id);if(typeof d==='string'){parts.push({type:'image_url',image_url:{url:d}});vision=true}}
      api.push({role:'user',content:parts});
    }else if(m.content)api.push({role:m.role,content:m.content});
  }
  const ar=/[\u0600-\u06FF]/.test(lastU.content||'');
  const task=vision?'vision':(intent==='code'||store.get('mode','general')==='code')?'code':'chat';
  await runText(task,api,acc=>{

async function doImage(c,lastU,a,prevMedia){
  let refs=[];

  if(!refs.length&&prevMedia){
    const pm=c.msgs[c.msgs.length-3];const im=pm&&pm.media&&pm.media.find(x=>x.type==='image');
    if(im){const d=await mGet(im.id);if(typeof d==='string')refs.push(d)}
  }
  const prompt=refs.length?lastU.content:await enhancePrompt('image',lastU.content,ctrl.signal);
  const content=refs.length?[{type:'text',text:prompt}].concat(refs.map(u=>({type:'image_url',image_url:{url:u}}))):prompt;
  let n=0,sawCredit=creditOut();
  for(const m of rankImage(refs.length>0)){
    if(creditOut()&&!m.free){sawCredit=true;continue}
    if(n++>=4)break;

    try{

      const res=await fetch(API+'/chat/completions',{method:'POST',headers:hdr(),signal:ac.signal,body:JSON.stringify(body)});
      if(!res.ok)throw await apiFail(res);
      const j=await res.json();if(j.error)throw new Error(j.error.message);
      const urls=parseImages(j);if(!urls.length)throw new Error('no image');

      return;
    }catch(e){

      if(e.status===401){const f=new Error('مفتاح الخدمة غير صالح حاليًا.');f.fatal=true;throw f}
      if(e.credit||e.status===402)sawCredit=true;
      markFail(API+'|'+m.id,e.status);dbg('image model failed',m.id,e.message||'');
    }finally{clearTimeout(t);un()}
  }
  if(!refs.length){
    try{await freeImage(prompt,lastU.content,a);return}
    catch(e){if(ctrl.signal.aborted){const u=new Error('user');u.user=true;throw u}dbg('free image failed',String(e.message||e))}
  }

async function freeImage(prompt,orig,a){
  const portrait=/9:16|طولي|portrait|موبايل|ستوري/i.test(orig),wide=/16:9|عريض|landscape|خلفية|wallpaper|بانر|banner/i.test(orig);
  const [w,h]=portrait?[720,1280]:wide?[1280,720]:[1024,1024];
  const url='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt.slice(0,900))+'?model=flux&width='+w+'&height='+h+'&nologo=true&seed='+Math.floor(Math.random()*1e9);
  let stored=null;
  try{
    const ac=new AbortController(),un=linkAbort(ctrl.signal,ac),t=setTimeout(()=>ac.abort(),100000);
    try{
      const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error('http '+r.status);
      const b=await r.blob();if(!/^image\//.test(b.type)||b.size<2000)throw new Error('bad image');
      stored=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(b)});
    }finally{clearTimeout(t);un()}
  }catch(e){
    if(ctrl.signal.aborted)throw e;
    await loadImg(url,100000);stored=url;          // CORS blocked: show the image straight from its URL
  }
  const id='m'+uid();await mPut(id,stored);a.media.push({type:'image',id});
}

async function doVideo(lastU,a){

  const prompt=await enhancePrompt('video',lastU.content,ctrl.signal);

document.addEventListener('click',async e=>{
  const a=e.target.closest('a[download]');if(!a||!AB||!(AB.save||AB.saveBegin))return;
  e.preventDefault();
  try{
    const bl=await (await fetch(a.href)).blob(),name=a.getAttribute('download')||'jeron',mime=bl.type||'application/octet-stream';
    const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const d=String(r.result);ok(d.slice(d.indexOf(',')+1))};r.onerror=no;r.readAsDataURL(blob)});
    let ok;
    if(AB.saveBegin){
      const id=AB.saveBegin(name,mime);if(!id)throw new Error('begin');
      const CH=1536*1024;
      for(let o=0;o<bl.size;o+=CH){if(!AB.saveChunk(id,await b64(bl.slice(o,o+CH))))throw new Error('chunk')}
      ok=AB.saveEnd(id);
    }else ok=AB.save(name,mime,await b64(bl));
    toast(ok?'تم الحفظ — مجلد التنزيلات/Jeron':'تعذر الحفظ');
  }catch(err){toast('تعذر الحفظ')}

const VIS_FAM=[['siliconflow','Qwen/Qwen2.5-VL-72B-Instruct'],['dashscope','qwen2.5-vl-72b-instruct'],['hf','Qwen/Qwen2.5-VL-72B-Instruct'],['gemini','gemini-2.5-flash']];
function visionCands(){

function rankText(task,vision,ar){

async function runText(task,messages,onDelta,user,opt){
  opt=opt||{};
  const cands=rankText(task,!!opt.vision,!!opt.ar);let lastErr=null,n=0;const off=isOffline();
  for(let i=0;i<cands.length;i++){
    const c=cands[i];
    if(c.plug){}
    else if(c.local){if(!LOCAL.installed()||task==='code')continue}
    else if(off)continue;
    if(creditOut()&&!c.free&&!c.extra)continue;
    if(n++>=14)break;
    try{
      const out=c.plug?await plugChat(messages,onDelta,user,task):c.local?await LOCAL.run(messages,onDelta,user):await streamOnce(c,messages,onDelta,user,task);
      store.set('win:'+task,c.id);if(opt.onModel)opt.onModel(c);return out;

  if(lastErr&&lastErr.status===401)lastErr.userMsg='مفتاح الخدمة غير صالح. أضف مفتاح مزود ثاني من الإعدادات (SiliconFlow / Groq / Hugging Face...).';
  if(lastErr&&lastErr.credit)lastErr.userMsg='رصيد المفتاح الأساسي خلص. أضف مفتاح مجاني من الإعدادات > المزودات (مثلاً SiliconFlow أو Groq) وراح يشتغل مباشرة.';
  throw lastErr||new Error('no models');

/* ---- on-device model (works without internet) ---- */
const LOCAL={
  gen:null,TS:null,IS:null,loading:null,
  cfg(){return store.get('local',{installed:false,model:'onnx-community/Qwen3-0.6B-ONNX'})},
  installed(){return !!this.cfg().installed},
  async load(progress){
    if(this.gen)return this.gen;
    if(this.loading)return this.loading;
    const cfg=this.cfg();
    this.loading=(async()=>{
      const mod=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1');
      mod.env.allowLocalModels=false;mod.env.useBrowserCache=true;
      try{mod.env.backends.onnx.wasm.proxy=true}catch(e){}
      this.TS=mod.TextStreamer;this.IS=mod.InterruptableStoppingCriteria;
      this.gen=await mod.pipeline('text-generation',cfg.model,{dtype:'q4',device:'wasm',progress_callback:progress||null});
      return this.gen;
    })();
    try{return await this.loading}finally{this.loading=null}
  },
  async install(progress){
    await this.load(progress);
    store.set('local',Object.assign(this.cfg(),{installed:true}));
  },
  remove(){
    this.gen=null;store.set('local',Object.assign(this.cfg(),{installed:false}));
    try{caches.keys().then(ks=>ks.filter(k=>/transformers/i.test(k)).forEach(k=>caches.delete(k)))}catch(e){}
  },
  async run(messages,onDelta,user){
    const gen=await this.load();
    const flat=m=>({role:m.role,content:typeof m.content==='string'?m.content:(m.content||[]).filter(p=>p.type==='text').map(p=>p.text).join('\n')});
    let msgs=messages.map(flat);
    const sys=msgs.filter(m=>m.role==='system').map(m=>m.content).join('\n').slice(0,700);
    msgs=msgs.filter(m=>m.role!=='system').slice(-8);
    if(msgs.length)msgs[msgs.length-1]={role:'user',content:msgs[msgs.length-1].content+' /no_think'};
    if(sys)msgs.unshift({role:'system',content:sys});
    let acc='';const stop=new this.IS();
    const onAbort=()=>stop.interrupt();if(user)user.addEventListener('abort',onAbort);
    const streamer=new this.TS(gen.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>{acc+=t;onDelta(acc.replace(/<think>[\s\S]*?(<\/think>|$)/g,'').trim())}});
    try{await gen(msgs,{max_new_tokens:700,do_sample:true,temperature:0.7,top_p:0.8,streamer,stopping_criteria:stop})}
    finally{if(user)user.removeEventListener('abort',onAbort)}
    if(user&&user.aborted){const u=new Error('user');u.user=true;throw u}
    const out=acc.replace(/<think>[\s\S]*?<\/think>/g,'').trim();
    if(!out)throw new Error('empty');
    return out;
  }
};

async function ttsCustom(text,c,signal){
  const ref=await mGet('refvoice');
  const extra=(()=>{try{return JSON.parse(c.extra||'{}')}catch(e){return{}}})();
  let init;
  if(c.body==='multipart'){
    const fd=new FormData();fd.append(c.tf||'text',text);if(c.lf)fd.append(c.lf,c.lang||'ar');
    for(const k in extra)fd.append(k,typeof extra[k]==='object'?JSON.stringify(extra[k]):String(extra[k]));
    if(ref&&c.rf)fd.append(c.rf,ref,'voice.'+(/wav/.test(ref.type)?'wav':/mpeg|mp3/.test(ref.type)?'mp3':'webm'));
    init={method:'POST',body:fd,headers:c.key?{Authorization:'Bearer '+c.key}:{}};
  }else{
    const o=Object.assign({},extra);o[c.tf||'text']=text;if(c.lf)o[c.lf]=c.lang||'ar';
    if(ref&&c.rf){const d=await blobToDataURL(ref);o[c.rf]=c.rm==='dataurl'?d:d.slice(d.indexOf(',')+1)}
    init={method:'POST',headers:Object.assign({'Content-Type':'application/json'},c.key?{Authorization:'Bearer '+c.key}:{}),body:JSON.stringify(o)};
  }
  const r=await fetch(c.url,Object.assign(init,{signal}));
  if(!r.ok)throw await apiFail(r);
  const ct=r.headers.get('Content-Type')||'';
  if(/^audio\//.test(ct)||/octet-stream/.test(ct))return await r.blob();
  const j=await r.json(),v=j.audio_url||j.url||j.audio||j.data||(j.output&&(j.output.audio_url||j.output.url));
  if(!v)throw new Error('no audio in response');

  return dataURLToBlob(/^data:/.test(v)?v:'data:audio/wav;base64,'+v);
}

const PATH_RE=/^[\w@\-./\u0600-\u06FF]+\.[A-Za-z0-9]{1,6}$/;

const FENCE=/```([^\n`]*)\n([\s\S]*?)(?:```|$)/g;
function parseInfo(info){
  let lang='',path='';
  for(let raw of String(info||'').trim().split(/\s+/)){
    if(!raw)continue;
    raw=raw.replace(/^(path|file|filename|title|name)=/i,'').replace(/^["'`]+|["'`,;]+$/g,'');
    const ci=raw.indexOf(':');
    if(ci>0&&!/^[a-z]+:\/\//i.test(raw)){const a=raw.slice(0,ci),b=raw.slice(ci+1);if(/^[\w+#-]+$/.test(a)&&PATH_RE.test(b)){lang=lang||a;path=path||b;continue}}

    if(!lang&&/^[\w+#-]+$/.test(raw))lang=raw;
  }

}
const FILE_COMMENT=/^\s*(?:<!--|\/\/|\/\*|#)\s*(?:file(?:name)?|path)\s*[:=]\s*([\w@\-./]+\.[A-Za-z0-9]{1,6})\s*(?:-->|\*\/)?\s*$/i;

  const out=[];let m;const s=String(text||'');FENCE.lastIndex=0;
  while((m=FENCE.exec(s))){
    const inf=parseInfo(m[1]);let code=m[2].replace(/\n$/,''),path=inf.path;
    const pm=FILE_COMMENT.exec(code.split('\n')[0]||'');
    if(pm){path=path||normPath(pm[1]);code=code.split('\n').slice(1).join('\n')}
    out.push({lang:inf.lang,path,code,explicit:!!path});
    if(m[0].length===0)FENCE.lastIndex++;
  }
  return out;
}
function filesOfMessage(text){
  const blocks=fenceBlocks(text),out=[],cnt={};
  for(const b of blocks){
    let p=b.path;const lang=b.lang;
    if(!p){
      if(!WEB_LANG.test(lang)||b.code.length<(/^html?$/.test(lang)?120:200))continue;
      const base={html:'index',htm:'index',css:'style',js:'script',javascript:'script',json:'data',py:'main',python:'main',md:'README',markdown:'README'}[lang]||'file';
      const n=(cnt[base]=(cnt[base]||0)+1);
      p=base+(n>1?n:'')+'.'+(LANG_EXT[lang]||lang);
    }
    out.push({path:p,lang:lang||extOf(p),code:b.code,explicit:b.explicit});
  }
  const proj=out.some(f=>f.explicit)||out.some(f=>/\.html?$/i.test(f.path)&&f.code.length>=120);

    if(m.role==='assistant')for(const f of filesOfMessage(m.content))pf[f.path]={text:f.code};
    if(uptoId&&m.id===uptoId)break;

  let out='CURRENT PROJECT FILES (the user\'s latest working version — edit these, keep everything that already works, and output every changed file COMPLETE):\n',left=budget;

  let html=pf[entry].text||'';
  const all=names.map(n=>pf[n].text||'').join('\n');
  const needAudio=/JeronAudio|jeron-audio\.js/.test(all);
  const norm=u=>String(u||'').replace(/^[a-z][a-z0-9+.-]*:\/\/[^/]+\//i,'').replace(/^\.?\//,'').split(/[?#]/)[0];
  const isLocal=u=>!/^(?:[a-z][a-z0-9+.-]*:)?\/\//i.test(u)&&!/^(data|blob|about|javascript|mailto):/i.test(u);
  html=html.replace(/<link\b[^>]*>/gi,tag=>{
    if(!/rel=["']?stylesheet/i.test(tag))return tag;
    const m=/href=["']([^"']+)["']/i.exec(tag);if(!m||!isLocal(m[1]))return tag;
    const f=pf[norm(m[1])];return f&&f.text!=null?'<style>'+f.text.replace(/<\/style/gi,'<\\/style')+'</style>':tag;
  });
  const late=[];
  html=html.replace(/<script\b([^>]*)>\s*<\/script>/gi,(tag,attrs)=>{
    const m=/\bsrc=["']([^"']+)["']/i.exec(attrs);if(!m||!isLocal(m[1]))return tag;
    const p=norm(m[1]);if(p==='jeron-audio.js'&&!pf[p])return '';
    const f=pf[p];if(!f||f.text==null)return tag;
    const rest=attrs.replace(/\bsrc=["'][^"']*["']/i,'').replace(/\b(defer|async)\b/gi,'');
    const out='<script'+rest+'>'+f.text.replace(/<\/script/gi,'<\\/script')+'<\/script>';
    if(/\bdefer\b/i.test(attrs)&&!/type=["']?module/i.test(attrs)){late.push(out);return''}
    return out;
  });
  if(late.length)html=/<\/body>/i.test(html)?html.replace(/<\/body>/i,()=>late.join('')+'</body>'):html+late.join('');
  const F={};
  for(const n of names){
    const f=pf[n];
    if(f.blob){const d=await blobToDataURL(f.blob);F[n]={d,m:f.blob.type||mimeOf(n)};html=html.split('./'+n).join(d).split(n).join(d)}
    else if(f.text!=null&&n!==entry&&f.text.length<400000)F[n]={t:f.text,m:mimeOf(n)};
  }
  if(!/^\s*<!doctype/i.test(html))html='<!doctype html>'+html;
  if(!/<meta[^>]+viewport/i.test(html)){
    html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,h=>h+'<meta name="viewport" content="width=device-width,initial-scale=1">'):html;
  }
  const inj='<script>window.__JF='+JSON.stringify(F).replace(/</g,'\\u003c')+'<\/script><script>('+pvHelper.toString()+')()<\/script>'+(needAudio?'<script>'+AUDIO_SAFE()+'<\/script>':'');
  if(/<head[^>]*>/i.test(html))html=html.replace(/<head[^>]*>/i,h=>h+inj);
  else if(/<html[^>]*>/i.test(html))html=html.replace(/<html[^>]*>/i,h=>h+'<head>'+inj+'</head>');
  else html=inj+html;
  return html;
}

function looseJSON(t){
  if(!t)return null;t=String(t);const tries=[t];
  const i=t.indexOf('{'),j=t.lastIndexOf('}'),a=t.indexOf('['),b=t.lastIndexOf(']');
  if(i>=0&&j>i)tries.push(t.slice(i,j+1));
  if(a>=0&&b>a)(i<0||a<i)?tries.unshift(t.slice(a,b+1)):tries.push(t.slice(a,b+1));
  for(const s of tries)for(const f of[x=>x,x=>x.replace(/,\s*([}\]])/g,'$1'),x=>x.replace(/,\s*([}\]])/g,'$1').replace(/(['"])?([a-zA-Z_]\w*)\1\s*:/g,'"$2":')]){try{return JSON.parse(f(s))}catch(e){}}
  return null;
}

    }catch(e){dbg('audio render',String(e.message||e))}

}

function codeBlockX(info,code,o){

function md(src,opt){
  opt=opt||{};let s=String(src);const odd=((s.match(/```/g)||[]).length)%2===1;
  if(odd)s+='\n```';
  const blocks=[],o={mid:opt.mid,n:0,light:!!opt.light};
  let total=(s.match(/```/g)||[]).length/2,seen=0;
  s=s.replace(/```([^\n]*)\n([\s\S]*?)```/g,(m,info,c)=>{seen++;const live=odd&&seen===total&&opt.light;blocks.push(codeBlockX(info,c.replace(/\n$/,''),Object.assign(o,{live})));return '\n@@B'+(blocks.length-1)+'@@\n'});
  const L=s.split('\n'),out=[];let i=0;
  const isList=l=>/^\s*([-*+]|\d+[.)])\s+/.test(l);
  const isStart=l=>/^@@B\d+@@$/.test(l)||/^#{1,4}\s/.test(l)||isList(l)||/^\s*>/.test(l)||/^\s*\|.*\|\s*$/.test(l)||/^\s*([-*_])\1{2,}\s*$/.test(l);
  while(i<L.length){
    const l=L[i];let m;
    if((m=l.match(/^@@B(\d+)@@$/))){out.push(blocks[+m[1]]);i++;continue}
    if(/^\s*$/.test(l)){i++;continue}
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){const n=Math.min(m[1].length+1,5);out.push('<h'+n+'>'+inline(esc(m[2]))+'</h'+n+'>');i++;continue}
    if(/^\s*([-*_])\1{2,}\s*$/.test(l)){out.push('<hr>');i++;continue}
    if(/^\s*>/.test(l)){const q=[];while(i<L.length&&/^\s*>/.test(L[i])){q.push(L[i].replace(/^\s*>\s?/,''));i++}out.push('<blockquote>'+inline(esc(q.join('\n'))).replace(/\n/g,'<br>')+'</blockquote>');continue}
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(esc(c.trim())));
      const head=cells(l);i+=2;const rows=[];
      while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(cells(L[i]));i++}
      out.push('<table><thead><tr>'+head.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue;
    }
    if(isList(l)){
      const ord=/^\s*\d+[.)]/.test(l),items=[];
      while(i<L.length&&isList(L[i])){items.push(inline(esc(L[i].replace(/^\s*([-*+]|\d+[.)])\s+/,''))));i++}
      const t=ord?'ol':'ul';out.push('<'+t+'>'+items.map(x=>'<li>'+x+'</li>').join('')+'</'+t+'>');continue;
    }
    const p=[l];i++;
    while(i<L.length&&!/^\s*$/.test(L[i])&&!isStart(L[i])){p.push(L[i]);i++}
    out.push('<p>'+inline(esc(p.join('\n'))).replace(/\n/g,'<br>')+'</p>');
  }
  return out.join('');
}

async function vcTurn(text){

  vcCap(text,'u');vcSetState('thinking');
  const persona=(store.get('persona','')||'').trim(),ci=(store.get('ci','')||'').trim();
  let sys=VOICE_SYS;if(persona)sys+='\n\nPERSONA (speak in this style): '+persona.slice(0,900);if(ci)sys+='\n\nUser preferences: '+ci.slice(0,600);
  const api=[{role:'system',content:sys}].concat(VC.hist.slice(-12),[{role:'user',content:text}]);
  let done=0,acc='',first=true;
  const flush=final=>{
    const rest=acc.slice(done);let cut=-1;
    if(final)cut=rest.length;
    else{const re=/[.!?؟…\n]/g;let m;while((m=re.exec(rest)))cut=m.index+1}
    if(cut>0){const chunk=rest.slice(0,cut);if(final||cleanSpeech(chunk).length>=10){done+=cut;const t=cleanSpeech(chunk);if(t)vcQueue(t,my)}}
  };

    await runText('chat',api,a=>{if(my!==VC.turn)return;acc=a;if(first){first=false}vcCap(a,'a');flush(false)},VC.abort.signal,{ar:true});
    if(my!==VC.turn)return;
    flush(true);
  }catch(e){
    if(my!==VC.turn||e.user)return;
    VC.llmDone=true;
    const why=e.userMsg||('ما كدرت أرد: '+String(e.message||e).slice(0,90)+' — راجع المفاتيح من الإعدادات');
    vcSetState('idle',why);vcCap(why,'e');toast(why.slice(0,80));dbg('voice llm',String(e.message||e));

  }

  VC.hist.push({role:'user',content:text},{role:'assistant',content:acc});
  const c=VC.conv;
  if(c){c.msgs.push({id:uid(),role:'user',content:text,imgs:[],ts:Date.now()},{id:uid(),role:'assistant',content:acc,media:[],ts:Date.now()});if(c.title==='محادثة جديدة')c.title='🎙 '+text.slice(0,36);c.ts=Date.now();save()}
  vcMaybeResume(my);

function vcQueue(text,my){

async function vcPump(my){
  if(VC.pumping)return;VC.pumping=true;
  while(VC.q.length&&VC.on&&my===VC.turn){
    const it=VC.q.shift();vcSetState('speaking');
    try{
      const b=it.p?await it.p:null;if(my!==VC.turn)break;
      if(b)await playBlob(b);
      else{
        const ok=await deviceSpeak(it.text);
        if(!ok&&my===VC.turn){
          let done=false;
          if(!VC.orOff&&orCurrent()){try{const bb=await ttsOR(it.text,VC.abort.signal);await playBlob(bb);done=true}catch(e){VC.orOff=true;dbg('voice or-tts',String(e.message||e).slice(0,80))}}
          if(!done&&!VC.hinted){VC.hinted=true;toast('ما لقيت صوت عربي بجهازك: ثبّت صوت عربي من إعدادات الهاتف (Text-to-speech) أو اربط محرك صوت من إعدادات الصوت');}
        }

function playBlob(blob){
  return new Promise(res=>{
    const url=URL.createObjectURL(blob),a=new Audio(url);VC.audio=a;
    try{
      const ctx=VC.actx||(VC.actx=new(window.AudioContext||window.webkitAudioContext)()),src=ctx.createMediaElementSource(a),an=ctx.createAnalyser();
      an.fftSize=256;src.connect(an);an.connect(ctx.destination);VC.an=an;if(ctx.state==='suspended')ctx.resume();
    }catch(e){VC.an=null;VC.fake=true}
    const end=()=>{VC.an=null;VC.fake=false;URL.revokeObjectURL(url);res()};
    a.onended=end;a.onerror=end;a.play().catch(end);
  });
}
function pickVoice(lang,name){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  if(name){const v=vs.find(x=>x.name===name);if(v)return v}

function deviceSpeak(text){
  return new Promise(res=>{
    if(!window.speechSynthesis){res(false);return}
    const cfg=store.get('dvoice',{}),u=new SpeechSynthesisUtterance(text);
    u.lang=cfg.lang||(/[؀-ۿ]/.test(text)?'ar-SA':'en-US');
    const v=pickVoice(u.lang,cfg.name);if(v)u.voice=v;
    u.rate=+cfg.rate||1;u.pitch=+cfg.pitch||1;
    let started=false;const t0=Date.now();
    const end=ok=>{VC.fake=false;res(ok===true||started||(Date.now()-t0>700))};
    u.onstart=()=>{started=true};u.onend=()=>end(true);u.onerror=()=>end(false);VC.fake=true;
    try{speechSynthesis.speak(u)}catch(e){end(false)}
    setTimeout(()=>{if(!started&&!speechSynthesis.speaking&&!speechSynthesis.pending){end(false)}},2500);
  });
}
function orbLoop(){
  if(VC.raf)return;
  const orb=vcEl('vcOrb');
  const step=t=>{
    VC.raf=0;if(!VC.on)return;
    let l=0;
    if(VC.state==='speaking'){
      if(VC.an){const d=new Uint8Array(VC.an.frequencyBinCount);VC.an.getByteFrequencyData(d);let s=0;for(let i=0;i<d.length;i++)s+=d[i];l=Math.min(1,s/d.length/90)}
      else l=0.35+0.25*Math.sin(t/110);
    }else if(VC.state==='listening'){VC.lvl*=0.9;l=VC.lvl}
    else if(VC.state==='thinking')l=0.15+0.1*Math.sin(t/260);
    orb.style.setProperty('--lvl',l.toFixed(3));
    VC.raf=requestAnimationFrame(step);
  };
  VC.raf=requestAnimationFrame(step);
}

  if(HOOKS[path])HOOKS[path]();
}

async function localInstall(){
  const p=$('#locP'),files={};
  try{
    await LOCAL.install(ev=>{
      if(ev&&ev.file)files[ev.file]={l:ev.loaded||0,t:ev.total||0};
      let L=0,T=0;for(const k in files){L+=files[k].l;T+=files[k].t}
      if(p)p.textContent=T?('جاري التنزيل… '+Math.round(L/T*100)+'% ('+Math.round(L/1048576)+' / '+Math.round(T/1048576)+' ميجا)'):'جاري التجهيز…';
    });

  }catch(e){if(p)p.textContent='فشل التنزيل: '+String(e.message||e).slice(0,120)+' — تأكد من النت وجرب مرة ثانية'}
}

/* ---- api errors: rotate OpenRouter keys instead of giving up ---- */
async function apiFail(res){
  let m='';try{m=(await res.clone().json()).error?.message||''}catch(e){}
  const e=new Error(m||('HTTP '+res.status));e.status=res.status;
  const isOR=/openrouter\.ai/i.test(res.url||'');
  const limit=res.status===402||res.status===401||(res.status===429&&/per-?day|daily|free-models|credit|key limit|limit exceeded/i.test(m))||NOCREDIT.test(m);
  if(isOR&&limit){
    const k=orCurrent();
    if(k){
      orKill(k,res.status===401?24*3600e3:3*3600e3);
      if(orCurrent()){e.rotated=true;dbg('or key switched',orStatus().alive+'/'+orStatus().total);return e}
    }
    e.credit=true;flagNoCredit();
  }else if(res.status===402||NOCREDIT.test(m)){e.credit=true;if(isOR||!res.url)flagNoCredit()}
  return e;
}

/* ---- model council: several strong models answer, one editor merges the best ---- */
function councilMembers(task){
  const seen=new Set(),out=[];
  for(const c of rankText(task,false,true)){
    if(c.local||c.plug)continue;
    const f=c.fam||(c.or?'or':'x')+':'+String(c.id).split('/')[0];
    if(seen.has(f))continue;seen.add(f);out.push(c);
    if(out.length>=3)break;
  }
  return out;
}
async function councilRun(task,api,onDelta,signal,opt){
  const mem=councilMembers(task);
  if(mem.length<2)return runText(task,api,onDelta,signal,opt);
  toast('مجلس النماذج: '+mem.map(c=>c.famN||c.id.split('/').pop()).join(' + '));
  const draftMsgs=api.slice();
  const drafts=(await Promise.all(mem.map(async c=>{
    try{const t=await completeOnce(c,draftMsgs,signal,70000);return{n:c.famN||c.id,t}}
    catch(e){if(signal&&signal.aborted)throw e;dbg('council member',c.id,String(e.message||e).slice(0,60));if(!e.rotated)markFail(ckey(c),e.status);return null}
  }))).filter(Boolean);
  if(drafts.length<2){
    if(drafts.length===1){onDelta(drafts[0].t);if(opt&&opt.onModel)opt.onModel(mem[0]);return drafts[0].t}
    return runText(task,api,onDelta,signal,opt);
  }
  const last=api[api.length-1];
  const lastTxt=typeof last.content==='string'?last.content:((last.content.find&&last.content.find(x=>x.type==='text'))||{}).text||'';
  const sys='You are the chief editor of a council of AI models. You get the conversation and several independent draft answers to the last user message. Write the single best final answer: keep what is correct and useful from every draft, fix mistakes and contradictions, be complete but not padded, and reply in the same language and dialect as the user. Never mention the drafts, the council or the models.';
  const body=api.slice(1,-1).concat([{role:'user',content:'Last user message:\n'+lastTxt+'\n\n'+drafts.map((d,i)=>'--- DRAFT '+(i+1)+' ---\n'+d.t).join('\n\n')+'\n\nNow write the final answer.'}]);
  const out=await runText(task,[{role:'system',content:api[0].content+'\n\n'+sys}].concat(body),onDelta,signal,opt);
  if(opt&&opt.onModel)opt.onModel({fam:'council',famN:'مجلس النماذج'});
  return out;
}

/* ---- voice sample: accepts audio OR a video (we take its sound) and makes a clean mono WAV ---- */
async function refToWav(file){
  const ab=await file.arrayBuffer();
  const ctx=new(window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,22050,22050);
  const buf=await new Promise((ok,no)=>ctx.decodeAudioData(ab,ok,no));
  const rate=22050,secs=Math.min(buf.duration,25),n=Math.floor(secs*rate);
  const off=new OfflineAudioContext(1,n,rate),src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start(0);
  const r=await off.startRendering(),d=r.getChannelData(0);
  const out=new DataView(new ArrayBuffer(44+n*2));
  const w=(o,s)=>{for(let i=0;i<s.length;i++)out.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');out.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');out.setUint32(16,16,true);out.setUint16(20,1,true);out.setUint16(22,1,true);
  out.setUint32(24,rate,true);out.setUint32(28,rate*2,true);out.setUint16(32,2,true);out.setUint16(34,16,true);w(36,'data');out.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const v=Math.max(-1,Math.min(1,d[i]));out.setInt16(44+i*2,v<0?v*0x8000:v*0x7fff,true)}
  return new Blob([out.buffer],{type:'audio/wav'});
}
